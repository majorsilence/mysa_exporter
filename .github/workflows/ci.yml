name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"

      - run: node --check index.mjs

      - run: npm ci --no-audit --no-fund

      - run: npm test

      - run: systemd-analyze verify systemd/mysa_exporter.service

      - run: python3 -m json.tool grafana/dashboard.json > /dev/null
