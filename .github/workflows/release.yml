name: Release

on:
  push:
    tags:
      - "v*.*.*"

env:
  NODE_VERSION: "24.21.0"

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Check package.json version matches the tag
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::tag v$tag_version does not match package.json version $pkg_version"
            exit 1
          fi

      - run: npm ci --omit=dev --no-audit --no-fund

      - name: Package the release tarball
        run: |
          version="${GITHUB_REF_NAME#v}"
          stage="mysa_exporter-${version}.linux-${{ matrix.arch }}"
          mkdir "$stage"
          cp index.mjs package.json "$stage/"
          cp -r node_modules "$stage/"
          cp -r systemd "$stage/"
          cp -r grafana "$stage/"
          tar czf "${stage}.tar.gz" "$stage"
          sha256sum "${stage}.tar.gz" > "${stage}.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.arch }}
          path: |
            mysa_exporter-*.tar.gz
            mysa_exporter-*.tar.gz.sha256
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Combine checksums
        working-directory: dist
        run: cat mysa_exporter-*.tar.gz.sha256 > sha256sums.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            dist/mysa_exporter-*.tar.gz \
            dist/sha256sums.txt
